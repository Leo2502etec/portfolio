<!-- contato.html -->
<!-- define o tipo de documento -->
<!DOCTYPE html>

<!-- início do HTML + idioma -->
<html lang="pt-BR">

<head>

    <!-- padrão de caracteres -->
    <meta charset="UTF-8">

    <!-- responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- título da aba -->
    <title>Contato | Leonardo Gregorio de Sousa</title>

    <!-- conexão com CSS -->
    <link rel="stylesheet" href="style.css"/>

</head>

<body>

    <!-- ====== HEADER ====== -->
    <header>

        <!-- manter padrão igual às outras páginas -->
        <div class="topo">

            <h1>Leonardo Gregorio de Sousa</h1>

            <!-- menu de navegação -->
            <nav>
                <a href="index.html">Home</a>
                <a href="projetos.html">Projetos</a>
                <a href="contato.html" class="ativo">Contato</a>
            </nav>

        </div>

    </header>
    
    <!-- ====== CONTEÚDO PRINCIPAL ====== -->
    <main>

        <!-- seção de contato -->
<section>

   <h2>Contato</h2>

   <!-- descrição da seção -->
   <p>Preencha o formulário abaixo e entrarei em contato em breve.</p>

   <!-- formulário integrado com Formspree -->
   <!-- substitua o link do action pelo link gerado no formspree.io -->
   <form action="https://formspree.io/f/mykojyoy" method="POST">

      <!-- campo de nome -->
      <div class="campo">
         <label for="nome">Nome</label>
         <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
      </div>

      <!-- campo de e-mail (para responder o visitante) -->
      <div class="campo">
         <label for="email">E-mail</label>
         <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <!-- campo de mensagem -->
      <div class="campo">
         <label for="mensagem">Mensagem</label>
         <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
      </div>

      <!-- botão de envio -->
      <button type="submit">Enviar mensagem</button>

   </form>

</section>
    </main>

    <!-- ====== FOOTER ====== -->
    <footer>

      <p>© <span id="ano"></span> Leonardo</p> 

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
    
</body>
</html>
